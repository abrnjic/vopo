version: '3.8'

services:
  db:
    image: postgres:15
    container_name: reseller_db
    environment:
      POSTGRES_USER: vopo
      POSTGRES_PASSWORD: vopopassword
      POSTGRES_DB: vopo_reseller
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
