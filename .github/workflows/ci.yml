name: CI Pipeline

on:
  push:
    branches:
      - main
      - checkpoint-apk-dist
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./reseller-portal
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: './reseller-portal/package-lock.json'

      - name: Install Dependencies
        run: npm ci
        
      - name: Check Whitespace and Formatting
        run: git diff --check
        working-directory: ./

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Audit
        run: npm audit --omit=dev
